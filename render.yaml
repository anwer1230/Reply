# Render Blueprint Specification for AutoReply Arabic
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: autoreply-arabic
    runtime: node
    plan: free
    region: frankfurt # Can be frankfurt, oregon, ohio, singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_URL
        fromService:
          type: web
          name: autoreply-arabic
          property: host
      - key: TELEGRAM_BOT_TOKEN
        sync: false
        comment: "رمز بوت تيليجرام من BotFather للرد التلقائي الفعلي"
      - key: WHATSAPP_VERIFY_TOKEN
        value: autoreply_secret_token_123
        comment: "رمز التحقق من الويب هوك في منصة ميتا واتساب"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
        comment: "رمز وصول WhatsApp Cloud API"
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
        comment: "معرف رقم هاتف WhatsApp Cloud API"
